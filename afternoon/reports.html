<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <title>รายการแจ้ง — Bangsaen Waste Vision</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="site">
        <h1><svg class="icon" aria-hidden="true"><use href="#icon-eye"></use></svg>Bangsaen Waste Vision</h1>
        <nav class="site" aria-label="เมนูหลัก">
            <a href="index.html"><svg class="icon" aria-hidden="true"><use href="#icon-chart"></use></svg>สถิติ</a>
            <a href="report.html"><svg class="icon" aria-hidden="true"><use href="#icon-flag"></use></svg>แจ้งจุดขยะ</a>
            <a href="reports.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#icon-list"></use></svg>รายการแจ้ง</a>
            <a href="vision.html"><svg class="icon" aria-hidden="true"><use href="#icon-eye"></use></svg>ศูนย์ตรวจสอบ</a>
        </nav>
    </header>

    <main>
        <section>
            <h1 class="page-title">รายการแจ้งจุดขยะ</h1>
            <p class="muted">รายการที่ประชาชนและเจ้าหน้าที่แจ้งเข้ามา เรียงจากใหม่ไปเก่า —
                ต้องการแจ้งเพิ่มไปที่หน้า <a href="report.html">แจ้งจุดขยะ</a></p>

            <form class="filter-bar" id="filter-bar" role="search">
                <label class="field field-search" for="filter-q">ค้นหาสถานที่
                    <input type="search" id="filter-q" name="q" placeholder="เช่น บางแสน, หนองมน" autocomplete="off">
                </label>
                <label class="field" for="filter-type">ประเภทขยะ
                    <select id="filter-type" name="waste_type">
                        <option value="">ทั้งหมด</option>
                        <option value="general">ทั่วไป</option>
                        <option value="recyclable">รีไซเคิล</option>
                        <option value="hazardous">อันตราย</option>
                        <option value="organic">อินทรีย์</option>
                    </select>
                </label>
                <label class="field" for="filter-status">สถานะ
                    <select id="filter-status" name="status">
                        <option value="">ทั้งหมด</option>
                        <option value="PENDING">รอดำเนินการ</option>
                        <option value="NEEDS_CHECK">ควรตรวจสอบ</option>
                        <option value="RESOLVED">ดำเนินการแล้ว</option>
                    </select>
                </label>
                <button type="button" class="btn-ghost btn-sm filter-reset" id="filter-reset">ล้างตัวกรอง</button>
            </form>

            <div class="table-wrap">
                <table id="reports-table" class="as-cards">
                    <thead>
                        <tr>
                            <th>สถานที่</th>
                            <th>ประเภท</th>
                            <th class="num">ปริมาณ (กก.)</th>
                            <th>รายละเอียด</th>
                            <th>สถานะ</th>
                            <th>เวลาแจ้ง</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <nav class="pagination" id="reports-pagination"></nav>
        </section>
    </main>

    <script src="js/ui.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
