<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#ffffff">
    <link rel="icon" href="assets/app-icon.svg" type="image/svg+xml">
    <title>รายการแจ้ง — Bangsaen Waste Vision</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css?v=20260920-polish2">
</head>
<body>
    <header class="site">
        <h1><a class="brand-link" href="index.html"><img class="brand-mark" src="assets/app-icon.svg" width="36" height="36" alt="">Bangsaen Waste Vision</a></h1>
        <nav class="site" aria-label="เมนูหลัก">
            <a href="index.html"><svg class="icon" aria-hidden="true"><use href="#icon-chart"></use></svg>สถิติ</a>
            <a href="report.html"><svg class="icon" aria-hidden="true"><use href="#icon-flag"></use></svg>แจ้งจุดขยะ</a>
            <a href="reports.html" aria-current="page"><svg class="icon" aria-hidden="true"><use href="#icon-list"></use></svg>รายการแจ้ง</a>
            <a href="detect.html"><svg class="icon" aria-hidden="true"><use href="#icon-camera"></use></svg>ตรวจจับ AI</a>
            <a href="vision.html"><svg class="icon" aria-hidden="true"><use href="#icon-eye"></use></svg>ศูนย์ตรวจสอบ</a>
            <a href="activity.html"><svg class="icon" aria-hidden="true"><use href="#icon-clock"></use></svg>ประวัติ</a>
        </nav>
    </header>

    <main>
        <section>
            <h1 class="page-title">รายการแจ้งจุดขยะ</h1>
            <p class="lede">เรื่องที่แจ้งผ่านเว็บนี้ เรียงจากใหม่ไปเก่า</p>


            <!-- ค้นหาอยู่นอก ส่วนตัวกรองที่เหลือพับไว้
                 คนส่วนใหญ่เข้ามาเพื่อ "หาจุดหนึ่ง" ไม่ใช่เพื่อไล่กรองทีละมิติ
                 จึงไม่ให้แถบตัวกรองสี่ช่องกินพื้นที่เหนือรายการตลอดเวลา -->
            <form class="filter-bar filter-bar-compact" id="filter-bar" role="search">
                <label class="field field-search" for="filter-q">
                    <span class="visually-hidden">ค้นหาสถานที่</span>
                    <input type="search" id="filter-q" name="q" placeholder="ค้นหาสถานที่ เช่น บางแสน, หนองมน" autocomplete="off">
                </label>

                <details class="filter-more" id="filter-more">
                    <summary>ตัวกรอง</summary>
                    <div class="filter-more-body">
                        <label class="field" for="filter-type">ประเภทขยะ
                            <select id="filter-type" name="waste_type">
                                <option value="">ทั้งหมด</option>
                                <option value="general">ทั่วไป</option>
                                <option value="recyclable">รีไซเคิล</option>
                                <option value="hazardous">อันตราย</option>
                                <option value="organic">อินทรีย์</option>
                            </select>
                        </label>
                        <label class="field" for="filter-status">สถานะ
                            <select id="filter-status" name="status">
                                <option value="">ทั้งหมด</option>
                                <option value="PENDING">รอตรวจสอบ</option>
                                <option value="NEEDS_CHECK">รอดำเนินการ</option>
                                <option value="RESOLVED">เสร็จแล้ว</option>
                                <option value="REJECTED">ไม่รับเรื่อง</option>
                            </select>
                        </label>
                        <label class="field" for="filter-origin">ที่มาของข้อมูล
                            <select id="filter-origin" name="record_origin">
                                <option value="">ทั้งหมด</option>
                                <option value="citizen">แจ้งผ่านหน้าเว็บ</option>
                                <option value="demo_seed">ข้อมูลตัวอย่าง</option>
                            </select>
                        </label>
                        <button type="button" class="btn-ghost btn-sm filter-reset" id="filter-reset">ล้างตัวกรอง</button>
                    </div>
                </details>
            </form>

            <div class="table-wrap">
                <table id="reports-table" class="as-cards">
                    <thead>
                        <tr>
                            <th>สถานที่</th>
                            <th>สถานะ</th>
                            <th>เวลาแจ้ง</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>

            <nav class="pagination" id="reports-pagination"></nav>
        </section>
    </main>

    <script src="js/ui.js?v=20260920-polish2"></script>
    <script src="js/reports.js?v=20260920-workflow"></script>
</body>
</html>
